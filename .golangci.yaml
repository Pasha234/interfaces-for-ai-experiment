version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - gocyclo
    - gocognit
    - maintidx
    - dupl
    - gosec
    - godoclint

  settings:
    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 10

    maintidx:
      under: 20

    dupl:
      threshold: 100

    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
